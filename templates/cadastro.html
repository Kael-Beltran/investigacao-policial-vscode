
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Criar conta</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='cadastro.css') }}">
</head>
<body>
    <main class="cadastro-page">
        <section class="cadastro-box" aria-labelledby="cadastro-title">
            <p class="cadastro-eyebrow">Sistema de investigação policial</p>
            <h1 id="cadastro-title">Criar conta</h1>
            <p class="cadastro-description">Cadastre seus dados para acessar o sistema.</p>

            {% with mensagens = get_flashed_messages(with_categories=true) %}
                {% for categoria, mensagem in mensagens %}
                    <p class="flash {{ categoria }}" role="alert">{{ mensagem }}</p>
                {% endfor %}
            {% endwith %}

            <form class="cadastro-form" method="POST">
                <label for="nome">Nome</label>
                <input id="nome" type="text" name="nome" placeholder="Seu nome" autocomplete="name" required>

                <label for="email">E-mail</label>
                <input id="email" type="email" name="email" placeholder="nome@exemplo.com" autocomplete="email" required>

                <label for="senha">Senha</label>
                <input id="senha" type="password" name="senha" placeholder="Mínimo de 8 caracteres" autocomplete="new-password" minlength="8" required>

                <button type="submit">Cadastrar</button>
            </form>

            <p class="cadastro-footer">Já tem uma conta? <a href="{{ url_for('login') }}">Entrar</a></p>
        </section>
    </main>
</body>
</html>
